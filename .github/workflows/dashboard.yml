name: refresh dashboard

on:
  schedule:
    - cron: "30 16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: breakout-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/New_York
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run regression tests
        run: python -m pytest

      - name: Advance paper account and render dashboard
        run: python breakout_dashboard.py --capital 8800 --start 2026-08-05

      - name: Commit refreshed dashboard and paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add breakout_dashboard.html \
            data/paper_breakout.json \
            data/paper_trades.csv \
            data/paper_equity.csv \
            data/extras_*.json
          if git diff --cached --quiet; then
            echo "No dashboard or paper-state changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh breakout dashboard"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p _site
          cp breakout_dashboard.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
